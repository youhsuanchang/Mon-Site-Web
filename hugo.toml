baseURL = "https://example.com/"
languageCode = "en-us"
title = "YOU-HSUAN CHANG"
theme = "hugo-ink"

[params]
  author = "YOU-HSUAN CHANG"
  description = "My personal site."
  homeTitle = "YOU-HSUAN CHANG"
  homeSubtitle = "A short tagline."
  homeBio = "I build things for the web and write about technology, design, and the craft of making software."
  homeImage = "/images/hugopp.jpg"    # Avatar on homepage (place in static/images/, renders as 110px circle)
  favicon = "/favicon.ico"            # Place in static/
  recentPostsCount = 3                # Posts shown on homepage (default: 3)
  askAI = []





# Social links — displayed in the homepage hero section
  [[params.socialLinks]]
    name = "GitHub"
    url = "https://github.com/youhsuanchang"
    external = true                   # Opens in new tab with external link indicator
  [[params.socialLinks]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/abby-cyh/"
    external = true
  [[params.socialLinks]]
    name = "Email"
    url = "obby0528@gmail.com"
    # need to find other way to show email
  [[params.socialLinks]]
  


# Navigation menu
[menu]
  [[menu.main]]
    name = "Now"
    url = "/now/"
    weight = 1
  [[menu.main]]
    name = "About"
    url = "/about/"
    weight = 2
  [[menu.main]]
    name = "Blog"
    url = "/posts/"
    weight = 3

# Output formats — add "llmstxt" and "JSON" to enable llms.txt and search
[outputs]
  home = ["HTML", "RSS", "llmstxt", "JSON"]

[outputFormats.llmstxt]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# Related posts — powers the "Related Posts" section on blog posts
[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = "tags"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

